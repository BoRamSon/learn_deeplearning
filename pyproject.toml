[project]
name = "industrial-accident-prevention"
version = "0.1.1"
description = "Deep learning project with PyTorch and CUDA"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "torch",
    "torchvision",
    "torchaudio",
    "python-dotenv>=1.1.1",
    "opencv-python>=4.11.0.86",
    "tensorflow>=2.20.0",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8.1.78", # backend는 headless로 충분
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# macOS용 MPS 인덱스 추가 (사실상 이것은 cpu와 동일함. 사실 없어도 됨.)
[[tool.uv.index]]
name = "pytorch-mps"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[tool.uv.sources]
torch = [
    # Windows/Linux → CUDA 12.8 wheel 인덱스
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # macOS → CPU wheel (MPS 지원 포함)
    { index = "pytorch-mps", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    # torchvision도 torch와 동일한 인덱스를 사용하도록 설정
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-mps", marker = "sys_platform == 'darwin'" },
]
torchaudio = [
    # torchaudio도 torch와 동일한 인덱스를 사용하도록 설정
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-mps", marker = "sys_platform == 'darwin'" },
]

[tool.setuptools]
py-modules = ["main"]
packages = ["backend"]
